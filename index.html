<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brandcraft – ресурси для бренд-дизайнерів</title>
<meta name="description" content="Добірка ресурсів для бренд-дизайнерів: айдентика, брендбуки, студії, AI-гайд та інструменти.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2316c784'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500&family=Funnel+Sans:wght@400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<script>
  // Apply saved theme before paint to avoid a flash.
  (function () {
    var t = 'auto';
    try { t = localStorage.getItem('bc-theme') || 'auto'; } catch (e) {}
    document.documentElement.dataset.themePref = t;
    if (t !== 'auto') document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  @font-face {
    font-family: "Geist Pixel";
    src: url("https://cdn.jsdelivr.net/npm/geist@1.7.2/dist/fonts/geist-pixel/GeistPixel-Square.woff2") format("woff2");
    font-display: swap;
  }

  :root {
    --canvas: #fff;
    --surface: #fff;
    --hover: #f0f0f0;
    --ink: #000;
    --ink-2: #616161;
    --ink-3: #707070;
    --line: #e0e0e0;
    --line-strong: #c7c7c7;
    --line-soft: #f0f0f0;
    --accent: #00bbff;
    --accent-ink: #007499;
    --hatch: #d6d6d6;
    --favicon-bg: #fff;
    --image-outline: #0000001a;

    --font-sans: "Funnel Sans", ui-sans-serif, system-ui, sans-serif;
    --font-display: "Funnel Display", var(--font-sans);
    --font-mono: "Geist Mono", ui-monospace, monospace;
    --font-pixel: "Geist Pixel", var(--font-mono);

    --radius-chip: 6px;
    --radius-control: 10px;
    --ease-out: cubic-bezier(.23, 1, .32, 1);
    --dur-hover: .15s;
    --dur-ui: .22s;

    --side-w: 288px;
    --main-w: 672px;
    --gutter: 16px;
    --pad-x: 28px;
    --pad-y: 32px;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #000;
      --surface: #0d0d0d;
      --hover: #262626;
      --ink: #fff;
      --ink-2: #a3a3a3;
      --ink-3: #858585;
      --line: #262626;
      --line-strong: #3d3d3d;
      --line-soft: #171717;
      --accent-ink: #00bbff;
      --hatch: #2a2a2a;
      --image-outline: #ffffff1a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --canvas: #000;
    --surface: #0d0d0d;
    --hover: #262626;
    --ink: #fff;
    --ink-2: #a3a3a3;
    --ink-3: #858585;
    --line: #262626;
    --line-strong: #3d3d3d;
    --line-soft: #171717;
    --accent-ink: #00bbff;
    --hatch: #2a2a2a;
    --image-outline: #ffffff1a;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font: 400 13px/1.5 var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background-color var(--dur-ui) var(--ease-out), color var(--dur-ui) var(--ease-out);
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-chip); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Frame ---------- */
  .frame {
    position: relative;
    max-width: calc(var(--side-w) + var(--main-w) + var(--gutter) * 2);
    margin: 0 auto;
    padding: 0 var(--gutter);
    min-height: 100dvh;
  }
  .frame::before, .frame::after {
    content: "";
    position: fixed;
    top: 0; bottom: 0;
    width: var(--gutter);
    background: repeating-linear-gradient(-45deg, var(--hatch) 0 1px, transparent 1px 6px);
    border-inline: 1px dashed var(--line);
    pointer-events: none;
  }
  .frame::before { left: max(0px, calc(50% - (var(--side-w) + var(--main-w)) / 2 - var(--gutter))); }
  .frame::after { right: max(0px, calc(50% - (var(--side-w) + var(--main-w)) / 2 - var(--gutter))); }

  .layout { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); }

  /* ---------- Sidebar ---------- */
  .side {
    position: sticky; top: 0;
    height: 100dvh;
    display: flex; flex-direction: column;
    border-right: 1px dashed var(--line);
    overflow-y: auto;
    scrollbar-width: none;
  }
  .side::-webkit-scrollbar { display: none; }
  .brand { padding: 28px 24px 22px; }
  .orb { display: block; width: 104px; height: 104px; margin-bottom: 18px; }
  .wordmark {
    display: inline-block;
    font: 400 19px/1 var(--font-pixel);
    letter-spacing: .01em;
    margin-bottom: 12px;
  }
  .wordmark span { color: var(--ink-3); }
  .tagline { margin: 0; color: var(--ink); max-width: 240px; text-wrap: pretty; }

  .side-block { padding: 18px 16px 6px; border-top: 1px dashed var(--line); }
  .label {
    display: block;
    padding: 0 8px 8px;
    font: 400 10px/1 var(--font-mono);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .nav-list, .sec-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
  .nav-link, .sec-link {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px;
    border-radius: var(--radius-chip);
    color: var(--ink-2);
    transition: color var(--dur-hover) var(--ease-out), background-color var(--dur-hover) var(--ease-out), transform var(--dur-hover) var(--ease-out);
  }
  .nav-link:hover, .sec-link:hover { color: var(--ink); }
  .nav-link:active, .sec-link:active { transform: scale(.98); }
  .nav-link[aria-current="page"], .sec-link.is-active {
    color: var(--ink);
    font-weight: 500;
    background: var(--hover);
    box-shadow: inset 0 0 0 1px var(--line-strong);
  }
  .nav-link svg { flex: none; width: 15px; height: 15px; color: var(--ink-3); }
  .nav-link[aria-current="page"] svg { color: var(--ink); }
  .count {
    margin-left: auto;
    font: 400 10px/1 var(--font-mono);
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .sec-block { flex: 1; }
  .sec-idx {
    flex: none; width: 18px;
    font: 400 10px/1 var(--font-mono);
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .sec-link.is-active .sec-idx { color: var(--ink); }

  /* ---------- Main ---------- */
  main { min-width: 0; }
  .topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    height: 48px;
    padding: 0 var(--pad-x);
    border-bottom: 1px dashed var(--line);
    background: color-mix(in srgb, var(--canvas) 82%, transparent);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .crumb { font: 400 11px/1 var(--font-mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumb b { font-weight: 400; color: var(--ink); }
  .theme-btn {
    display: grid; place-items: center;
    width: 30px; height: 30px;
    border-radius: var(--radius-control);
    color: var(--ink-2);
    transition: color var(--dur-hover) var(--ease-out), background-color var(--dur-hover) var(--ease-out), transform var(--dur-hover) var(--ease-out);
  }
  .theme-btn:hover { color: var(--ink); background: var(--hover); }
  .theme-btn:active { transform: scale(.94); }
  .theme-btn svg { width: 17px; height: 17px; }
  .theme-btn [data-icon] { display: none; }
  :root[data-theme-pref="auto"] .theme-btn [data-icon="auto"],
  :root[data-theme-pref="light"] .theme-btn [data-icon="light"],
  :root[data-theme-pref="dark"] .theme-btn [data-icon="dark"] { display: block; }

  .section {
    padding: var(--pad-y) var(--pad-x);
    border-bottom: 1px dashed var(--line);
    scroll-margin-top: 48px;
  }
  .section:last-child { min-height: calc(100dvh - 48px); border-bottom: 0; }
  .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 14px; }
  .sec-num { font: 400 10px/1 var(--font-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .sec-title { margin: 0; font: 500 16px/1.3 var(--font-display); letter-spacing: -.01em; }
  .sec-desc { flex: 1; min-width: 0; margin: 0; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .items { list-style: none; margin: 0; padding: 0; }
  .item { display: block; }
  .row {
    display: flex; align-items: flex-start; gap: 10px;
    width: fit-content; max-width: 100%;
    padding: 4.8px 0;
    border-radius: var(--radius-chip);
    transition: transform var(--dur-hover) var(--ease-out);
  }
  .row:active { transform: scale(.98); }
  .fav {
    position: relative; flex: none;
    width: 18px; height: 18px; margin-top: 1px;
    border-radius: var(--radius-chip);
    background: var(--favicon-bg);
    overflow: hidden;
    box-shadow: inset 0 0 0 1px var(--image-outline);
  }
  .fav img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .fav-fallback {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font: 500 10px/1 var(--font-sans);
    color: #000;
  }
  .txt {
    display: flex; align-items: center; gap: 8px; min-width: 0;
    text-decoration: underline;
    text-decoration-color: transparent;
    text-underline-offset: .3em;
    text-decoration-thickness: from-font;
    transition: text-decoration-color var(--dur-ui) var(--ease-out);
  }
  .row:hover .txt, .row:focus-visible .txt { text-decoration-color: currentColor; }
  .name { flex: none; font-weight: 500; color: var(--ink); line-height: 1.4; }
  .dot { flex: none; width: 3px; height: 3px; border-radius: 50%; background: var(--line-strong); }
  .desc { min-width: 0; color: var(--ink-2); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .arrow {
    flex: none; width: 14px; height: 14px; margin-top: 2px;
    color: var(--ink-3);
    opacity: 0;
    transform: translate(-3px, 3px);
    transition: opacity var(--dur-hover) var(--ease-out), transform var(--dur-ui) var(--ease-out);
  }
  .row:hover .arrow, .row:focus-visible .arrow { opacity: 1; transform: none; }

  .cases { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 8px 28px; padding: 0; list-style: none; }
  .case {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 7px 3px 8px;
    border: 1px solid var(--line);
    border-radius: var(--radius-chip);
    font: 400 11px/1.3 var(--font-mono);
    color: var(--ink-2);
    transition: color var(--dur-hover) var(--ease-out), border-color var(--dur-hover) var(--ease-out), background-color var(--dur-hover) var(--ease-out);
  }
  .case svg { width: 10px; height: 10px; color: var(--ink-3); }
  .case:hover { color: var(--ink); border-color: var(--line-strong); background: var(--hover); }

  /* ---------- AI Guide ---------- */
  .g-section p { margin: 0; }
  .g-section code {
    font: 400 11.5px/1 var(--font-mono);
    padding: 2px 5px;
    border-radius: 4px;
    background: var(--hover);
    color: var(--ink);
    white-space: nowrap;
  }
  .g-note, .g-small { color: var(--ink-3); text-wrap: pretty; }
  .g-note { margin: 0 0 16px; max-width: 60ch; }
  .g-small { margin-top: 10px; font-size: 12px; }
  .badge {
    align-self: center;
    padding: 2px 7px;
    border-radius: 999px;
    font: 400 10px/1.4 var(--font-mono);
    color: var(--accent-ink);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
  }

  .g-defs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-bottom: 14px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius-control); overflow: hidden; }
  .g-def { display: grid; align-content: start; gap: 4px; padding: 12px 14px; background: var(--canvas); }
  .g-def-k { font: 500 13px/1.3 var(--font-display); }
  .g-def-v { color: var(--ink-2); text-wrap: pretty; }

  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; margin-bottom: 16px; border: 1px solid var(--line); border-radius: var(--radius-control); }
  .seg-btn {
    position: relative;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    border-radius: 7px;
    text-align: left;
    color: var(--ink-2);
    transition: background-color var(--dur-hover) var(--ease-out), color var(--dur-hover) var(--ease-out), transform var(--dur-hover) var(--ease-out);
  }
  .seg-btn:hover { color: var(--ink); background: var(--line-soft); }
  .seg-btn:active { transform: scale(.98); }
  .seg-btn[aria-pressed="true"] { color: var(--ink); background: var(--hover); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .seg-n {
    flex: none; display: grid; place-items: center;
    width: 20px; height: 20px; border-radius: 6px;
    font: 400 11px/1 var(--font-mono);
    border: 1px solid var(--line-strong);
  }
  .seg-btn[aria-pressed="true"] .seg-n { background: var(--ink); color: var(--canvas); border-color: var(--ink); }
  .seg-t { font-weight: 500; line-height: 1.25; }
  .seg-goal { margin-left: auto; font: 400 10px/1 var(--font-mono); color: var(--accent-ink); }

  .matrix, .models { width: 100%; border-collapse: collapse; }
  .matrix th, .matrix td, .models th, .models td { padding: 12px 10px 12px 0; text-align: left; vertical-align: top; border-top: 1px dashed var(--line); }
  .matrix thead th, .models thead th {
    padding-top: 0; padding-bottom: 8px; border-top: 0;
    font: 400 10px/1.3 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3);
  }
  .matrix td:last-child, .models td:last-child { padding-right: 0; }
  .m-num { width: 28px; font: 400 10px/1.9 var(--font-mono); color: var(--ink-3); }
  .m-skill { width: 23%; font-weight: 500; color: var(--ink); line-height: 1.4; }
  .m-level { width: 40%; color: var(--ink); line-height: 1.5; text-wrap: pretty; }
  .m-check { color: var(--ink-2); line-height: 1.5; text-wrap: pretty; font-size: 12px; }
  .m-label { display: none; }
  .swap tr { animation: rise .4s var(--ease-out) both; }

  .g-callout { margin-bottom: 16px !important; padding: 12px 14px; border-left: 2px solid var(--accent); background: var(--line-soft); border-radius: 0 var(--radius-chip) var(--radius-chip) 0; color: var(--ink-2); text-wrap: pretty; }
  .models .t-task { width: 46%; font-weight: 400; }
  .t-title { display: block; font-weight: 500; color: var(--ink); line-height: 1.4; margin-bottom: 4px; }
  .t-note { display: block; color: var(--ink-3); line-height: 1.5; text-wrap: pretty; }
  .pill {
    display: inline-block;
    padding: 3px 8px;
    border-radius: var(--radius-chip);
    font: 500 12px/1.3 var(--font-sans);
    background: var(--hover);
    box-shadow: inset 0 0 0 1px var(--line-strong);
    color: var(--ink);
  }
  .pill-hint { display: block; margin-top: 5px; font-size: 12px; color: var(--ink-3); line-height: 1.4; text-wrap: pretty; }
  .pill-gap { display: block; height: 10px; }
  .g-empty { color: var(--ink-3); }
  .g-src { margin: 8px 0 0; }

  .g-rows { display: grid; }
  .g-row { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 4px 20px; padding: 12px 0; border-top: 1px dashed var(--line); }
  .g-row:first-child { border-top: 0; padding-top: 4px; }
  .g-row-accent .g-term { color: var(--accent-ink); }
  .g-term { font: 500 13px/1.45 var(--font-sans); color: var(--ink); }
  .g-body { color: var(--ink-2); line-height: 1.55; text-wrap: pretty; }
  .g-body > p + p { margin-top: 8px; }

  .g-trees { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .g-tree { padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-control); }
  .g-tree .g-term { display: block; margin-bottom: 10px; }
  .tree { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
  .tree li { position: relative; display: grid; grid-template-columns: auto 1fr; align-items: baseline; gap: 10px; padding-left: 16px; }
  .tree li::before { content: ""; position: absolute; left: 3px; top: -7px; bottom: 50%; width: 8px; border-left: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); border-bottom-left-radius: 3px; }
  .tree li.tree-root { padding-left: 0; }
  .tree li.tree-root::before { display: none; }
  .tree li span { color: var(--ink-3); font-size: 12px; line-height: 1.4; }

  .prompt { margin-bottom: 16px; border: 1px solid var(--line); border-radius: var(--radius-control); overflow: hidden; }
  .prompt-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 14px; border-bottom: 1px dashed var(--line); font: 400 10px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .copy-btn { padding: 5px 9px; border-radius: var(--radius-chip); font: 400 11px/1 var(--font-mono); letter-spacing: 0; text-transform: none; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-strong); transition: color var(--dur-hover) var(--ease-out), background-color var(--dur-hover) var(--ease-out); }
  .copy-btn:hover { color: var(--ink); background: var(--hover); }
  .prompt p { padding: 12px 14px; font: 400 12.5px/1.6 var(--font-mono); color: var(--ink); }

  .refcard { display: grid; grid-template-columns: 112px 1fr; gap: 14px; margin-bottom: 10px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius-control); }
  .refcard-img {
    display: grid; place-items: end start;
    aspect-ratio: 4 / 5; padding: 6px;
    border-radius: 6px;
    background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 55%, var(--canvas)), color-mix(in srgb, #6b5cff 45%, var(--canvas)));
  }
  .refcard-img span { font: 400 9px/1.2 var(--font-mono); color: #fff; opacity: .9; }
  .refcard dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-content: start; }
  .refcard dt { font: 400 10px/1.8 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
  .refcard dd { margin: 0; color: var(--ink); line-height: 1.5; }
  .tag { display: inline-block; margin: 0 4px 4px 0; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 12px; color: var(--ink-2); }

  .steps { list-style: none; margin: 0; padding: 0; display: grid; }
  .step { position: relative; display: grid; grid-template-columns: 28px 1fr; gap: 14px; padding-bottom: 18px; }
  .step:not(:last-child)::after { content: ""; position: absolute; left: 13.5px; top: 30px; bottom: 4px; border-left: 1px dashed var(--line-strong); }
  .step-n { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font: 400 12px/1 var(--font-mono); border: 1px solid var(--line-strong); background: var(--canvas); }
  .step:first-child .step-n { background: var(--ink); color: var(--canvas); border-color: var(--ink); }
  .step-body h3 { margin: 4px 0 4px; font: 500 14px/1.3 var(--font-display); }
  .step-body p { color: var(--ink-2); line-height: 1.55; text-wrap: pretty; }

  /* ---------- Motion ---------- */
  .rise { opacity: 0; transform: translateY(6px); filter: blur(4px); }
  .is-in .rise {
    animation: rise .52s var(--ease-out) forwards;
    animation-delay: var(--d, 0ms);
  }
  @keyframes rise { to { opacity: 1; transform: none; filter: none; } }
  .content { transition: opacity .18s var(--ease-out); }
  .content.is-leaving { opacity: 0; }
  @media (prefers-reduced-motion: reduce) {
    .rise { opacity: 1; transform: none; filter: none; }
    .is-in .rise { animation: none; }
    .content { transition: none; }
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 1023px) {
    :root { --pad-x: 16px; --pad-y: 24px; }
    .frame { padding: 0; }
    .frame::before, .frame::after { display: none; }
    .layout { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; height: auto; border-right: 0; border-bottom: 1px dashed var(--line); overflow: visible; }
    .brand { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 16px; padding: 20px 16px 16px; }
    .orb { grid-row: span 2; width: 64px; height: 64px; margin: 0; }
    .wordmark { margin: 0; align-self: end; }
    .tagline { align-self: start; max-width: none; color: var(--ink-2); }
    .side-block { padding: 12px 0 12px; }
    .side-block .label { padding: 0 16px 8px; }
    .nav-list, .sec-list {
      display: flex; gap: 6px;
      overflow-x: auto;
      padding: 0 16px;
      scrollbar-width: none;
      position: relative;
    }
    .nav-list::-webkit-scrollbar, .sec-list::-webkit-scrollbar { display: none; }
    .nav-list li, .sec-list li { flex: none; }
    .nav-link, .sec-link { box-shadow: inset 0 0 0 1px var(--line); padding: 8px 10px; white-space: nowrap; }
    .count { margin-left: 4px; }
    .sec-block { display: none; }
    .topbar { top: 0; }
    .row { width: 100%; padding: 6px 0; }
    .txt { flex-direction: column; align-items: flex-start; gap: 1px; }
    .dot { display: none; }
    .desc { white-space: normal; }
    .arrow { display: none; }
    .sec-desc { white-space: normal; flex-basis: 100%; }
    .g-defs, .g-trees { grid-template-columns: 1fr; }
    .seg { grid-template-columns: 1fr; }
    .matrix thead, .models thead { display: none; }
    .matrix, .matrix tbody, .matrix tr, .matrix th, .matrix td,
    .models, .models tbody, .models tr, .models th, .models td { display: block; width: auto; }
    .matrix tr, .models tr { padding: 14px 0; border-top: 1px dashed var(--line); }
    .matrix th, .matrix td, .models th, .models td { border: 0; padding: 0 0 8px; }
    .matrix .m-num { float: left; width: 28px; }
    .matrix .m-level, .matrix .m-check { clear: both; }
    .m-label { display: block; margin-bottom: 3px; font: 400 10px/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
    .g-row { grid-template-columns: 1fr; }
    .refcard { grid-template-columns: 80px 1fr; }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="layout">
    <aside class="side">
      <div class="brand">
        <canvas class="orb" aria-hidden="true"></canvas>
        <a class="wordmark" href="#/">brandcraft<span>.guide</span></a>
        <p class="tagline">A curated collection of identity craft, brand guidelines, studios, AI workflows, and tools for brand designers.</p>
      </div>
      <nav class="side-block" aria-label="Категорії">
        <span class="label">Navigation</span>
        <ul class="nav-list" id="nav"></ul>
      </nav>
      <nav class="side-block sec-block" aria-label="Розділи">
        <span class="label">Sections</span>
        <ul class="sec-list" id="secnav"></ul>
      </nav>
    </aside>

    <main>
      <div class="topbar">
        <span class="crumb" id="crumb"></span>
        <button class="theme-btn" id="theme" type="button" aria-label="Перемкнути тему">
          <svg data-icon="auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.25"/><path d="M12 3.75v16.5A8.25 8.25 0 0 0 12 3.75Z" fill="currentColor"/></svg>
          <svg data-icon="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.75v1.5M12 19.75v1.5M2.75 12h1.5M19.75 12h1.5M5.46 5.46l1.06 1.06M17.48 17.48l1.06 1.06M5.46 18.54l1.06-1.06M17.48 6.52l1.06-1.06"/></svg>
          <svg data-icon="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M20.25 14.6A8.25 8.25 0 1 1 9.4 3.75a6.5 6.5 0 0 0 10.85 10.85Z"/></svg>
        </button>
      </div>
      <div class="content" id="content"></div>
    </main>
  </div>
</div>

<script src="data.js"></script>
<script>
(function () {
  var DATA = window.CATALOGUE;
  var GUIDE = window.AI_GUIDE;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');

  var ICONS = {
    spark: '<path d="M12 3.5c.6 4.4 2.9 6.9 8 8.5-5.1 1.6-7.4 4.1-8 8.5-.6-4.4-2.9-6.9-8-8.5 5.1-1.6 7.4-4.1 8-8.5Z"/>',
    brand: '<path d="M4.75 4.75h6.5v6.5h-6.5zM12.75 12.75h6.5v6.5h-6.5z"/><circle cx="16" cy="8" r="3.25"/><path d="M8 13l3.25 6.25h-6.5Z"/>',
    palette: '<path d="M12 3.75a8.25 8.25 0 0 0 0 16.5c1.2 0 1.75-.8 1.75-1.6 0-1.3-1-1.5-1-2.65 0-.9.7-1.5 1.6-1.5h1.9a3.5 3.5 0 0 0 3.5-3.5c0-4-3.5-7.25-7.75-7.25Z"/><circle cx="8" cy="11" r="1"/><circle cx="11" cy="7.5" r="1"/><circle cx="15.25" cy="8.5" r="1"/>',
    tool: '<path d="M14.5 5.5a4 4 0 0 0 4.9 4.9L20.25 9.6l-2.4 2.4-5.85 5.85a2.12 2.12 0 0 1-3-3l5.85-5.85 2.4-2.4Z"/><path d="M4 4l4.5 4.5M3.75 8.25l4.5-4.5"/>',
    ai: '<rect x="5.75" y="5.75" width="12.5" height="12.5" rx="2.5"/><path d="M9.5 15l1.6-6h1.8l1.6 6M10.1 13h3.8M9 2.75v3M15 2.75v3M9 18.25v3M15 18.25v3M2.75 9h3M2.75 15h3M18.25 9h3M18.25 15h3"/>',
    people: '<circle cx="9" cy="8.5" r="3.25"/><path d="M3.75 19.25c.6-3 2.7-4.75 5.25-4.75s4.65 1.75 5.25 4.75"/><path d="M15.5 5.6a3.25 3.25 0 0 1 0 5.8M17.5 14.9c1.5.6 2.4 2.1 2.75 4.35"/>'
  };
  var ARROW = '<svg class="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6.65s6.94-.54 7.92.43c.97.98.43 7.92.43 7.92M16.5 7.5l-10 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ARROW_SM = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 7h9v9M17 7 7 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function total(cat) {
    if (cat.type === 'guide') return GUIDE.skills.length;
    return cat.sections.reduce(function (n, s) { return n + s.items.length; }, 0);
  }
  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }
  function host(url) { try { return new URL(url).hostname; } catch (e) { return ''; } }

  /* ---------- Theme ---------- */
  var themeBtn = document.getElementById('theme');
  var ORDER = ['auto', 'light', 'dark'];
  function setTheme(t) {
    var root = document.documentElement;
    root.dataset.themePref = t;
    if (t === 'auto') delete root.dataset.theme; else root.dataset.theme = t;
    themeBtn.setAttribute('aria-label', 'Перемкнути тему, зараз: ' + { auto: 'авто', light: 'світла', dark: 'темна' }[t]);
    try { localStorage.setItem('bc-theme', t); } catch (e) {}
  }
  setTheme(document.documentElement.dataset.themePref || 'auto');
  themeBtn.addEventListener('click', function () {
    var cur = document.documentElement.dataset.themePref || 'auto';
    setTheme(ORDER[(ORDER.indexOf(cur) + 1) % ORDER.length]);
  });

  /* ---------- Render ---------- */
  var navEl = document.getElementById('nav');
  var secNavEl = document.getElementById('secnav');
  var contentEl = document.getElementById('content');
  var crumbEl = document.getElementById('crumb');

  navEl.innerHTML = DATA.map(function (c, i) {
    var href = i === 0 ? '#/' : '#/' + c.id;
    return '<li><a class="nav-link" data-cat="' + c.id + '" href="' + href + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[c.icon] + '</svg>' +
      '<span>' + esc(c.title) + '</span><span class="count">' + total(c) + '</span></a></li>';
  }).join('');

  function favicon(url, name) {
    var h = host(url);
    return '<span class="fav"><span class="fav-fallback" aria-hidden="true">' + esc(name.charAt(0)) + '</span>' +
      '<img src="https://www.google.com/s2/favicons?domain=' + encodeURIComponent(h) + '&sz=64" alt="" width="18" height="18" loading="lazy" decoding="async" referrerpolicy="no-referrer"></span>';
  }

  function renderItem(it, i) {
    var cases = it.cases && it.cases.length
      ? '<ul class="cases rise" style="--d:' + Math.min(i * 22 + 40, 700) + 'ms" aria-label="Кейси ' + esc(it.name) + '">' +
        it.cases.map(function (c) {
          return '<li><a class="case" href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.label) + ARROW_SM + '</a></li>';
        }).join('') + '</ul>'
      : '';
    return '<li class="item">' +
      '<a class="row rise" style="--d:' + Math.min(i * 22, 660) + 'ms" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
      favicon(it.url, it.name) +
      '<span class="txt"><span class="name">' + esc(it.name) + '</span><span class="dot" aria-hidden="true"></span>' +
      '<span class="desc">' + esc(it.desc) + '</span></span>' + ARROW +
      '<span class="sr-only"> (відкривається в новій вкладці)</span></a>' + cases + '</li>';
  }

  function renderCategory(cat) {
    return cat.sections.map(function (s, si) {
      return '<section class="section" id="' + s.id + '" aria-labelledby="h-' + s.id + '">' +
        '<div class="sec-head rise"><span class="sec-num">' + pad(si + 1) + '</span>' +
        '<h2 class="sec-title" id="h-' + s.id + '">' + esc(s.title) + '</h2>' +
        '<p class="sec-desc">' + esc(s.desc) + '</p></div>' +
        '<ul class="items">' + s.items.map(renderItem).join('') + '</ul></section>';
    }).join('');
  }

  /* ---------- AI Guide ---------- */
  var GUIDE_SECTIONS = [
    { id: 'skills', short: 'Skill Matrix', count: GUIDE.skills.length },
    { id: 'environments', short: 'Claude, Claude Code & Codex', count: GUIDE.env.length },
    { id: 'models', short: 'Models to Start With', count: GUIDE.models.length },
    { id: 'storage', short: 'What to Save', count: GUIDE.save.length },
    { id: 'workflow', short: 'Workflow Example', count: GUIDE.workflow.length },
    { id: 'assessment', short: 'Training & Assessment', count: GUIDE.assess.length },
    { id: 'sources', short: 'Sources', count: GUIDE.sources.length }
  ];
  var level = 2;
  try { level = +localStorage.getItem('bc-ai-level') || 2; } catch (e) {}

  // Wraps file names and paths (brief.md, refs/, .claude/skills/x/) in <code>.
  function rich(t) {
    return esc(t)
      .replace(/(^|[\s(«])((?:\.?[a-z0-9_-]+\/)+(?:[a-z0-9_-]+(?:\.[a-z0-9]+)*)?|[a-z0-9_-]+\.(?:md|png|pptx))(?=[\s,.;:»)]|$)/g, '$1<code>$2</code>')
      .replace(/ --- /g, ' <code>---</code> ')
      .replace(/полями name та description/g, 'полями <code>name</code> та <code>description</code>');
  }
  function sourcesHtml(list, d) {
    if (!list || !list.length) return '';
    return '<ul class="cases g-src rise" style="--d:' + (d || 0) + 'ms" aria-label="Джерела">' + list.map(function (c) {
      return '<li><a class="case" href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.label) + ARROW_SM + '</a></li>';
    }).join('') + '</ul>';
  }
  function head(id, i, title, desc, extra) {
    return '<div class="sec-head rise"><span class="sec-num">' + pad(i) + '</span>' +
      '<h2 class="sec-title" id="h-' + id + '">' + esc(title) + '</h2>' + (extra || '') +
      (desc ? '<p class="sec-desc">' + esc(desc) + '</p>' : '') + '</div>';
  }
  function section(id, body) {
    return '<section class="section g-section" id="' + id + '" aria-labelledby="h-' + id + '">' + body + '</section>';
  }

  function matrixRows() {
    return GUIDE.skills.map(function (sk, i) {
      return '<tr class="rise" style="--d:' + Math.min(80 + i * 30, 500) + 'ms">' +
        '<td class="m-num">' + pad(sk.n) + '</td>' +
        '<th scope="row" class="m-skill">' + esc(sk.name) + '</th>' +
        '<td class="m-level"><span class="m-label">' + esc(GUIDE.levelNames[level - 1]) + '</span>' + rich(sk['l' + level]) + '</td>' +
        '<td class="m-check"><span class="m-label">' + esc(GUIDE.checkName) + '</span>' + rich(sk.check) + '</td></tr>';
    }).join('');
  }

  function renderGuide() {
    var g = GUIDE, out = [];

    // 01 Skills matrix
    var defs = g.intro.split(/\.\s+(?=[A-ZА-ЯІЇЄҐ])/).map(function (p) {
      var m = p.replace(/\.$/, '').split(' – ');
      return '<div class="g-def"><span class="g-def-k">' + esc(m[0]) + '</span><span class="g-def-v">' + esc(m[1] || '') + '</span></div>';
    }).join('');
    var seg = g.levelNames.map(function (name, i) {
      var n = i + 1;
      return '<button type="button" class="seg-btn" data-level="' + n + '" aria-pressed="' + (n === level) + '">' +
        '<span class="seg-n">' + n + '</span><span class="seg-t">' + esc(name.replace(/^\d\s·\s/, '')) + '</span>' +
        (n === 2 ? '<span class="seg-goal">ціль</span>' : '') + '</button>';
    }).join('');
    out.push(section('skills',
      head('skills', 1, 'Матриця навичок', g.title) +
      '<div class="g-defs rise" style="--d:40ms">' + defs + '</div>' +
      '<p class="g-note rise" style="--d:60ms">' + esc(g.levels) + '</p>' +
      '<div class="seg rise" style="--d:80ms" role="group" aria-label="Рівень навички">' + seg + '</div>' +
      '<table class="matrix"><thead><tr><th scope="col" class="m-num">#</th><th scope="col">Навичка</th>' +
      '<th scope="col" id="m-level-head">' + esc(g.levelNames[level - 1]) + '</th><th scope="col">' + esc(g.checkName) + '</th></tr></thead>' +
      '<tbody id="matrix-body">' + matrixRows() + '</tbody></table>'));

    // 02 Environments
    var env = g.env.map(function (r, i) {
      return '<div class="g-row rise" style="--d:' + (40 + i * 40) + 'ms"><span class="g-term">' + esc(r.k) + '</span>' +
        '<div class="g-body"><p>' + rich(r.v) + '</p>' + sourcesHtml(r.sources, 60 + i * 40) + '</div></div>';
    }).join('');
    out.push(section('environments', head('environments', 2, 'Claude, Claude Code і Codex', 'Що саме обирати: програма, модель, інструмент.') + '<div class="g-rows">' + env + '</div>'));

    // 03 Models
    var checked = (g.modelsTitle.match(/перевірено\s+([\d.]+)/) || [])[1];
    function cell(m) {
      if (!m) return '<span class="g-empty">–</span>';
      return '<span class="pill">' + esc(m[0]) + '</span><span class="pill-hint">' + esc(m[1]) + '</span>';
    }
    var models = g.models.map(function (m, i) {
      return '<tr class="rise" style="--d:' + (80 + i * 50) + 'ms"><th scope="row" class="t-task"><span class="t-title">' + esc(m.task) + '</span>' +
        '<span class="t-note">' + esc(m.note) + '</span>' + sourcesHtml(m.sources, 0) + '</th>' +
        '<td><span class="m-label">Codex</span>' + cell(m.codex) + (m.codex2 ? '<span class="pill-gap"></span>' + cell(m.codex2) : '') + '</td>' +
        '<td><span class="m-label">Claude</span>' + cell(m.claude) + '</td></tr>';
    }).join('');
    out.push(section('models',
      head('models', 3, 'З яких моделей починати', '', checked ? '<span class="badge">перевірено ' + esc(checked) + '</span>' : '') +
      '<p class="g-callout rise" style="--d:40ms">' + esc(g.modelsIntro) + '</p>' +
      '<table class="models"><thead><tr><th scope="col">Задача</th><th scope="col">Codex</th><th scope="col">Claude</th></tr></thead><tbody>' + models + '</tbody></table>'));

    // 04 Storage
    var folder = g.save[0], skillRow = g.save[1];
    var folderParts = folder.v.split(/\.\s+(?=[А-ЯІЇЄҐA-Z])/);
    var tree = folderParts[0].split('; ').map(function (p) {
      var kv = p.split(' – ');
      return '<li><code>' + esc(kv[0]) + '</code><span>' + esc(kv[1] || '') + '</span></li>';
    }).join('');
    var prompt = (skillRow.v.match(/«([^»]+)»/) || [])[1] || '';
    var skillTree = [
      ['ut-social-post/', ''], ['SKILL.md', 'назва, умова запуску, кроки, перевірки'],
      ['assets/', 'шаблон'], ['references/', 'правила й приклади'], ['scripts/', 'лише якщо збірка потребує коду']
    ].map(function (r, i) {
      return '<li' + (i === 0 ? ' class="tree-root"' : '') + '><code>' + esc(r[0]) + '</code><span>' + esc(r[1]) + '</span></li>';
    }).join('');
    var rest = g.save.slice(2).map(function (r, i) {
      var body;
      if (r.k === 'Картка референсу') {
        body = '<div class="refcard"><div class="refcard-img" aria-hidden="true"><span>refs/event-01.png</span></div>' +
          '<dl><dt>Оригінал</dt><dd>URL · автор</dd><dt>Теги</dt><dd><span class="tag">подія</span><span class="tag">великий заголовок</span><span class="tag">фото</span></dd>' +
          '<dt>Коментар</dt><dd>Беремо масштаб заголовка й розташування фото; палітра, шрифт і логотип – United Tech.</dd></dl></div>' +
          '<p>Додати посилання на ваш готовий пост, якщо прийом уже застосований. Не зберігати лише посилання на стрічку або профіль.</p>';
      } else {
        body = '<p>' + rich(r.v) + '</p>';
      }
      return '<div class="g-row rise" style="--d:' + (40 + i * 40) + 'ms"><span class="g-term">' + esc(r.k) + '</span><div class="g-body">' + body + sourcesHtml(r.sources, 0) + '</div></div>';
    }).join('');
    out.push(section('storage',
      head('storage', 4, 'Що зберігати', 'Щоб задача повторювалася без старої переписки.') +
      '<div class="g-trees">' +
      '<div class="g-tree rise" style="--d:40ms"><span class="g-term">' + esc(folder.k) + '</span><ul class="tree">' + tree + '</ul><p class="g-small">' + esc(folderParts.slice(1).join('. ')) + '</p></div>' +
      '<div class="g-tree rise" style="--d:80ms"><span class="g-term">' + esc(skillRow.k) + '</span><ul class="tree">' + skillTree + '</ul>' + sourcesHtml(skillRow.sources, 0) + '</div>' +
      '</div>' +
      (prompt ? '<div class="prompt rise" style="--d:120ms"><div class="prompt-head"><span>Промпт для агента</span>' +
        '<button type="button" class="copy-btn" data-copy="' + esc(prompt) + '">Скопіювати</button></div><p>' + esc(prompt) + '</p></div>' : '') +
      '<div class="g-rows">' + rest + '</div>'));

    // 05 Workflow
    var steps = g.workflow.map(function (r, i) {
      var t = r.k.replace(/^\d+\.\s*/, '');
      return '<li class="step rise" style="--d:' + (40 + i * 60) + 'ms"><span class="step-n">' + (i + 1) + '</span>' +
        '<div class="step-body"><h3>' + esc(t) + '</h3><p>' + rich(r.v) + '</p>' + sourcesHtml(r.sources, 0) + '</div></li>';
    }).join('');
    out.push(section('workflow', head('workflow', 5, 'Приклад workflow', g.workflowTitle || 'Пост про внутрішню подію.') + '<ol class="steps">' + steps + '</ol>'));

    // 06 Assessment
    var assess = g.assess.map(function (r, i) {
      return '<div class="g-row rise' + (r.k === 'Спільні правила' ? ' g-row-accent' : '') + '" style="--d:' + (40 + i * 40) + 'ms"><span class="g-term">' + esc(r.k) + '</span>' +
        '<div class="g-body"><p>' + rich(r.v) + '</p>' + sourcesHtml(r.sources, 0) + '</div></div>';
    }).join('');
    out.push(section('assessment', head('assessment', 6, 'Навчання та оцінка', 'Навчальні задачі, оцінювання й щотижнева практика.') + '<div class="g-rows">' + assess + '</div>'));

    // 07 Sources
    out.push(section('sources', head('sources', 7, 'Джерела', 'Документація й курси, на які спирається гайд.') +
      '<ul class="items">' + g.sources.map(renderItem).join('') + '</ul>'));

    return out.join('');
  }

  function bindGuide() {
    var segEl = contentEl.querySelector('.seg');
    if (segEl) segEl.addEventListener('click', function (e) {
      var b = e.target.closest('.seg-btn');
      if (!b) return;
      level = +b.dataset.level;
      try { localStorage.setItem('bc-ai-level', level); } catch (err) {}
      [].forEach.call(segEl.querySelectorAll('.seg-btn'), function (x) { x.setAttribute('aria-pressed', String(+x.dataset.level === level)); });
      document.getElementById('m-level-head').textContent = GUIDE.levelNames[level - 1];
      var body = document.getElementById('matrix-body');
      body.innerHTML = matrixRows();
      body.classList.remove('swap'); void body.offsetWidth; body.classList.add('swap');
    });
    [].forEach.call(contentEl.querySelectorAll('.copy-btn'), function (b) {
      b.addEventListener('click', function () {
        var txt = b.dataset.copy;
        var done = function () { b.textContent = 'Скопійовано'; setTimeout(function () { b.textContent = 'Скопіювати'; }, 1600); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () {});
        else {
          var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); done(); } catch (e) {}
          ta.remove();
        }
      });
    });
  }

  /* ---------- Reveal + scrollspy ---------- */
  var revealObs = null, spyObs = null;
  function observe() {
    if (revealObs) revealObs.disconnect();
    if (spyObs) spyObs.disconnect();
    var sections = [].slice.call(contentEl.querySelectorAll('.section'));
    if (reduced.matches || !('IntersectionObserver' in window)) {
      sections.forEach(function (s) { s.classList.add('is-in'); });
    } else {
      revealObs = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('is-in'); revealObs.unobserve(e.target); }
        });
      }, { rootMargin: '0px 0px -8% 0px' });
      sections.forEach(function (s) { revealObs.observe(s); });
    }
    if ('IntersectionObserver' in window) {
      spyObs = new IntersectionObserver(function () { updateSpy(); }, { rootMargin: '-49px 0px -55% 0px' });
      sections.forEach(function (s) { spyObs.observe(s); });
    }
    updateSpy();
  }
  function updateSpy() {
    var sections = [].slice.call(contentEl.querySelectorAll('.section'));
    var active = sections[0];
    var line = 49 + window.innerHeight * 0.2;
    sections.forEach(function (s) { if (s.getBoundingClientRect().top <= line) active = s; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) active = sections[sections.length - 1];
    [].forEach.call(secNavEl.querySelectorAll('.sec-link'), function (a) {
      a.classList.toggle('is-active', active && a.dataset.sec === active.id);
    });
  }
  window.addEventListener('scroll', function () { requestAnimationFrame(updateSpy); }, { passive: true });

  /* ---------- Router ---------- */
  var current = null;
  function parse() {
    var parts = location.hash.replace(/^#\/?/, '').split('/');
    var cat = DATA.filter(function (c) { return c.id === parts[0]; })[0] || DATA[0];
    return { cat: cat, sec: parts[1] || null };
  }
  function scrollToSection(id, smooth) {
    var el = document.getElementById(id);
    if (!el) return;
    // 48px = sticky topbar height
    var y = el.getBoundingClientRect().top + window.scrollY - 47;
    window.scrollTo({ top: y, behavior: smooth && !reduced.matches ? 'smooth' : 'auto' });
  }
  function route() {
    var r = parse();
    if (current === r.cat.id) {
      if (r.sec) scrollToSection(r.sec, true);
      return;
    }
    var first = current === null;
    current = r.cat.id;
    function swap() {
      var isGuide = r.cat.type === 'guide';
      contentEl.innerHTML = isGuide ? renderGuide() : renderCategory(r.cat);
      // Guide: numbered steps matching the 01–07 headings, no counts (they read as step numbers).
      secNavEl.innerHTML = (isGuide ? GUIDE_SECTIONS : r.cat.sections).map(function (s, i) {
        var label = '<span>' + esc(s.short || s.title_en || s.title) + '</span>';
        return '<li><a class="sec-link" data-sec="' + s.id + '" href="#/' + r.cat.id + '/' + s.id + '">' +
          (isGuide ? '<span class="sec-idx">' + pad(i + 1) + '</span>' + label
                   : label + '<span class="count">' + pad(s.items.length) + '</span>') + '</a></li>';
      }).join('');
      [].forEach.call(navEl.querySelectorAll('.nav-link'), function (a) {
        if (a.dataset.cat === r.cat.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
      });
      var n = total(r.cat);
      crumbEl.innerHTML = '<b>' + esc(r.cat.title) + '</b> / ' + n + ' ' +
        (isGuide ? plural(n, 'навичка', 'навички', 'навичок') : plural(n, 'посилання', 'посилання', 'посилань'));
      document.title = (r.cat === DATA[0] ? 'Brandcraft' : r.cat.title + ' – Brandcraft') + ' – ресурси для бренд-дизайнерів';
      if (isGuide) bindGuide();
      if (r.sec) scrollToSection(r.sec, false); else if (!first) window.scrollTo(0, 0);
      observe();
      contentEl.classList.remove('is-leaving');
      centerActiveChip();
    }
    if (first || reduced.matches) swap();
    else { contentEl.classList.add('is-leaving'); setTimeout(swap, 180); }
  }
  // Mobile: keep the active category chip in view without scrolling the page.
  function centerActiveChip() {
    var a = navEl.querySelector('[aria-current="page"]');
    if (!a || navEl.scrollWidth <= navEl.clientWidth) return;
    var li = a.parentElement;
    navEl.scrollLeft = li.offsetLeft - (navEl.clientWidth - li.offsetWidth) / 2;
  }
  window.addEventListener('hashchange', route);
  route();

  /* ---------- Favicon fallback ---------- */
  contentEl.addEventListener('error', function (e) {
    if (e.target.tagName === 'IMG') e.target.remove();
  }, true);
  // Google returns a 16px globe for unknown domains; hide it so the letter shows.
  contentEl.addEventListener('load', function (e) {
    var img = e.target;
    if (img.tagName === 'IMG' && img.naturalWidth > 0 && img.naturalWidth <= 16) img.remove();
  }, true);

  /* ---------- Dithered orb ---------- */
  var cv = document.querySelector('.orb');
  var ctx = cv.getContext('2d');
  var BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  var RAMP = [[4, 22, 14], [8, 52, 32], [12, 96, 56], [16, 146, 84], [22, 199, 132], [132, 236, 186], [232, 255, 242]];
  var cell = 3, raf = 0, last = 0;

  // "U." mark rasterised once into a 128px alpha mask, sampled per dither cell.
  var MASK_N = 128, mask = (function () {
    var m = document.createElement('canvas');
    m.width = m.height = MASK_N;
    var g = m.getContext('2d');
    g.fillStyle = '#000';
    function uShape(x, y, w, h, r) {
      g.beginPath();
      g.moveTo(x, y); g.lineTo(x, y + h - r);
      g.arc(x + r, y + h - r, r, Math.PI, 0, true);
      g.lineTo(x + w, y); g.closePath();
    }
    uShape(16, 28, 68, 72, 34); g.fill();
    g.globalCompositeOperation = 'destination-out';
    uShape(37, 18, 26, 62, 13); g.fill();
    g.globalCompositeOperation = 'source-over';
    g.fillRect(91, 78, 22, 22);
    var data = g.getImageData(0, 0, MASK_N, MASK_N).data, a = new Uint8Array(MASK_N * MASK_N);
    for (var i = 0; i < a.length; i++) a[i] = data[i * 4 + 3];
    return a;
  })();
  // Decal space: x, y in [-1, 1] on the sphere face; the mark fills ~70% of the diameter.
  function inMark(x, y) {
    var px = Math.round(64 + x * 64 / 0.78), py = Math.round(64 + y * 64 / 0.78);
    if (px < 0 || py < 0 || px >= MASK_N || py >= MASK_N) return false;
    return mask[py * MASK_N + px] > 127;
  }

  function sizeOrb() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = cv.clientWidth;
    cv.width = w * dpr; cv.height = w * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return w;
  }
  var W = sizeOrb();
  function drawOrb(t) {
    var n = Math.floor(W / cell), r = n / 2;
    ctx.clearRect(0, 0, W, W);
    var a = t * 0.00035;
    var lx = -0.35 + Math.cos(a) * 0.45, ly = -0.5 + Math.sin(a * 0.7) * 0.2, lz = 1;
    var ll = Math.hypot(lx, ly, lz); lx /= ll; ly /= ll; lz /= ll;
    // Spin around the vertical axis; one turn ≈ 7s.
    var spin = t * 0.0009, cs = Math.cos(spin), sn = Math.sin(spin);
    for (var y = 0; y < n; y++) {
      for (var x = 0; x < n; x++) {
        var nx = (x + 0.5 - r) / r, ny = (y + 0.5 - r) / r, d = nx * nx + ny * ny;
        if (d > 1) continue;
        var nz = Math.sqrt(1 - d);
        var diff = Math.max(0, nx * lx + ny * ly + nz * lz);
        var spec = Math.pow(diff, 18) * 0.9;
        var rim = Math.pow(1 - nz, 3) * 0.35;
        var band = 0.06 * Math.sin((nx * 3 + ny * 2) * 3 + t * 0.0012);
        var v = Math.min(1, 0.08 + diff * 0.72 + spec + rim + band);
        // Point in the sphere's rotating frame; front decal reads normally, the back one
        // is mirrored so it reads correctly when it turns to face the viewer.
        var rx = nx * cs - nz * sn, rz = nx * sn + nz * cs;
        if (inMark(rz >= 0 ? rx : -rx, ny)) v = 0.02 + diff * 0.16;
        var lvl = v * (RAMP.length - 1);
        var lo = Math.floor(lvl), f = lvl - lo;
        var th = (BAYER[(y % 4) * 4 + (x % 4)] + 0.5) / 16;
        var c = RAMP[Math.min(RAMP.length - 1, f > th ? lo + 1 : lo)];
        ctx.fillStyle = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
        ctx.fillRect(x * cell, y * cell, cell - 0.6, cell - 0.6);
      }
    }
  }
  function loop(t) {
    raf = requestAnimationFrame(loop);
    if (t - last < 50) return;
    last = t;
    drawOrb(t);
  }
  // ?orb=<ms> renders a single static frame (for screenshots and QA).
  var fixedT = /[?&]orb=(\d+)/.exec(location.search);
  function startOrb() {
    cancelAnimationFrame(raf);
    if (fixedT) { drawOrb(+fixedT[1]); return; }
    if (reduced.matches || document.hidden) drawOrb(0);
    else raf = requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', startOrb);
  reduced.addEventListener && reduced.addEventListener('change', startOrb);
  window.addEventListener('resize', function () { W = sizeOrb(); drawOrb(last); });
  startOrb();
})();
</script>
</body>
</html>
